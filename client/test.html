<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff00cc, #3333ff, #00ffcc);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .glass {
    width: 300px;
    height: 200px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 20px;
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
    font-size: 20px;
  }
</style>
</head>
<body>
  <div class="glass">If this box is blurry/frosted, glass works</div>
</body>
</html>
