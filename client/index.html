<!DOCTYPE html>
<html>
<head>
  <title>OrbitOS</title>
  <link rel="stylesheet" href="os.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
    <script>
        window.__scramjet$config = {
            prefix: '/scramjet/',
            encodeUrl: (url) => encodeURIComponent(url),
            decodeUrl: (url) => decodeURIComponent(url)
        };
    </script>
    <script type="module" src="/scram-init.js" defer></script>

</head>
<body>
<canvas id="space-bg"></canvas>
<video id="galaxy-bg" class="hidden" muted loop playsinline>
  <source src="galaxy-bg.mp4" type="video/mp4">
</video>

  <div id="boot-screen">
    <div id="logo-wrap">
      <svg id="logo-browser" viewBox="0 0 100 100" width="220" height="220">
        <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="14"/>
        <circle cx="50" cy="50" r="15" fill="#000"/>
        <circle cx="50" cy="50" r="15" fill="none" stroke="currentColor" stroke-width="3"/>
        <circle cx="50" cy="50" r="6" fill="currentColor"/>
        <line x1="50" y1="10" x2="50" y2="20" stroke="currentColor" stroke-width="3"/>
        <line x1="50" y1="80" x2="50" y2="90" stroke="currentColor" stroke-width="3"/>
        <line x1="10" y1="50" x2="20" y2="50" stroke="currentColor" stroke-width="3"/>
        <line x1="80" y1="50" x2="90" y2="50" stroke="currentColor" stroke-width="3"/>
      </svg>

      <svg id="logo-orbit" viewBox="0 0 100 100" width="220" height="220">
        <circle cx="50" cy="50" r="13" fill="currentColor"/>
        <ellipse cx="50" cy="50" rx="38" ry="15" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <circle id="moon" cx="88" cy="50" r="5" fill="currentColor"/>
      </svg>
    </div>
    <div id="boot-text">ORBIT-OS</div>
  </div>

  <div id="lock-screen" class="hidden">
    <div id="lock-greeting"></div>
    <div id="lock-time"></div>
    <div id="lock-date"></div>
    <div id="lock-hint">Click anywhere to continue</div>
  </div>

  <div id="login-screen" class="hidden">
    <div class="login-box">
      <svg viewBox="0 0 100 100" width="56" height="56">
        <circle cx="50" cy="50" r="13" fill="#fff"/>
        <ellipse cx="50" cy="50" rx="38" ry="15" fill="none" stroke="#fff" stroke-width="1.5"/>
        <circle cx="88" cy="50" r="5" fill="#fff"/>
      </svg>
      <h2 id="form-title">Welcome to OrbitOS</h2>
      <input type="text" id="username" placeholder="Name" autocomplete="off">
      <input type="password" id="password" placeholder="Password" autocomplete="off">
      <div id="form-message"></div>
      <button id="login-btn">Log In</button>
      <div id="switch-mode">Don't have an account? <span id="switch-link">Sign Up</span></div>
    </div>
  </div>

  <div id="desktop" class="hidden">
    <div id="welcome-msg"></div>

    <div id="settings-window" class="app-window hidden">
      <div class="window-titlebar">
        <div class="window-dots">
          <span class="dot dot-red" data-action="close"></span>
          <span class="dot dot-yellow" data-action="minimize"></span>
          <span class="dot dot-green" data-action="fullscreen"></span>
        </div>
        <div class="window-title">Settings</div>
      </div>
      <div class="window-body">
        <p>Settings panel — more options coming soon.</p>
      </div>
      <div class="resize-handle"></div>
      <div class="resize-edge right"></div>
      <div class="resize-edge bottom"></div>
    </div>

    <div id="browser-window" class="app-window hidden">
      <div class="window-titlebar">
        <div class="window-dots">
          <span class="dot dot-red" data-action="close"></span>
          <span class="dot dot-yellow" data-action="minimize"></span>
          <span class="dot dot-green" data-action="fullscreen"></span>
        </div>
        <div class="window-title">Orbitify</div>
      </div>
      <div class="browser-bar">
        <div class="browser-nav-btn" id="browser-home" title="Home">⌂</div>
        <input type="text" id="browser-url" placeholder="Search DuckDuckGo or enter address">
        <button id="browser-go">Go</button>
      </div>
      <iframe id="browser-frame" class="browser-frame"></iframe>
      <div class="resize-handle"></div>
      <div class="resize-edge right"></div>
      <div class="resize-edge bottom"></div>
    </div>

    <div id="dock-zone"></div>
    <div id="dock">
      <div class="dock-icon" id="dock-browser" title="Orbitify">
        <svg viewBox="0 0 100 100" width="30" height="30">
          <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="8"/>
          <line x1="12" y1="50" x2="88" y2="50" stroke="currentColor" stroke-width="4"/>
          <path d="M50 10 A 40 40 0 0 1 50 90 A 40 40 0 0 1 50 10" fill="none" stroke="currentColor" stroke-width="4"/>
        </svg>
      </div>
      <div class="dock-icon" id="dock-settings" title="Settings">
        <svg viewBox="0 0 100 100" width="40" height="40">
          <circle cx="50" cy="50" r="14" fill="none" stroke="currentColor" stroke-width="7"/>
          <line x1="50" y1="8" x2="50" y2="20" stroke="currentColor" stroke-width="7"/>
          <line x1="50" y1="80" x2="50" y2="92" stroke="currentColor" stroke-width="7"/>
          <line x1="8" y1="50" x2="20" y2="50" stroke="currentColor" stroke-width="7"/>
          <line x1="80" y1="50" x2="92" y2="50" stroke="currentColor" stroke-width="7"/>
          <line x1="20" y1="20" x2="28" y2="28" stroke="currentColor" stroke-width="7"/>
          <line x1="72" y1="72" x2="80" y2="80" stroke="currentColor" stroke-width="7"/>
          <line x1="80" y1="20" x2="72" y2="28" stroke="currentColor" stroke-width="7"/>
          <line x1="28" y1="72" x2="20" y2="80" stroke="currentColor" stroke-width="7"/>
        </svg>
      </div>
    </div>
  </div>

  <script src="/scramjet/scramjet.all.js"></script>
<script type="module" src="scram-init.js"></script>
  <script src="os.js"></script>
<!-- Proxy Browser Search Box -->
<!-- Proxy Browser Search Box -->
<div id="proxy-browser-container" style="text-align: center; width: 100%; position: relative; z-index: 100; margin-top: 50px;">
    <form id="browser-form" style="margin: 15px auto; max-width: 500px; display: flex; gap: 8px;">
        <input type="text" id="url-input" placeholder="Search DuckDuckGo..." style="flex-grow: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.2); background: rgba(15,15,26,0.7); color: #fff; font-family: 'Orbitron', sans-serif; outline: none;">
        <button type="submit" style="padding: 12px 24px; border-radius: 25px; border: none; background: rgba(255,255,255,0.15); color: #fff; font-family: 'Orbitron', sans-serif; cursor: pointer;">Go</button>
    </form>
    
    <div id="view-container" style="width: 85vw; height: 65vh; margin: 0 auto; background: #fff; border-radius: 12px; overflow: hidden; display: none;">
        <iframe id="content-frame" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>
</div>

<!-- Browser Logic Interceptor Script -->
<script>
    const form = document.getElementById('browser-form');
    const urlInput = document.getElementById('url-input');
    const frame = document.getElementById('content-frame');
    const viewContainer = document.getElementById('view-container');

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        let input = urlInput.value.trim();
        if (!input) return;
        
        if (!input.includes('.') || input.includes(' ')) {
            input = 'https://duckduckgo.com' + encodeURIComponent(input);
        } else if (!/^https?:\/\//i.test(input)) {
            input = 'https://' + input;
        }

        if (typeof window.__scramjet$config !== 'undefined') {
            const proxyUrl = window.__scramjet$config.prefix + window.__scramjet$config.encodeUrl(input);
            window.open(proxyUrl, '_blank');
        } else {
            window.open(input, '_blank'); 
        }
    });
</script>

</body>
</html>
